<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">TriviaQA retrieval-augmented question answering pipeline</title>
  <desc id="desc">Wikipedia evidence is cleaned and chunked, indexed for sparse and dense retrieval, reranked, and passed with a question to an instruction-tuned language model.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
      .subtitle{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .heading{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
      .body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .white{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="520" rx="20" fill="#f8fafc"/>
  <text x="50" y="55" class="title">RAG pipeline on TriviaQA</text>
  <text x="50" y="82" class="subtitle">Wikipedia evidence retrieval and grounded short-answer generation</text>

  <g filter="url(#shadow)">
    <rect x="45" y="155" width="185" height="120" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <rect x="285" y="155" width="185" height="120" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <rect x="525" y="130" width="210" height="170" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <rect x="790" y="155" width="165" height="120" rx="14" fill="#7c3aed"/>
    <rect x="1010" y="155" width="145" height="120" rx="14" fill="#111827"/>
  </g>

  <text x="137" y="193" text-anchor="middle" class="heading">TriviaQA</text>
  <text x="137" y="220" text-anchor="middle" class="body">questions + aliases</text>
  <text x="137" y="243" text-anchor="middle" class="body">Wikipedia articles</text>

  <text x="377" y="190" text-anchor="middle" class="heading">Preprocessing</text>
  <text x="377" y="218" text-anchor="middle" class="body">350-word chunks</text>
  <text x="377" y="241" text-anchor="middle" class="body">70-word overlap</text>

  <text x="630" y="165" text-anchor="middle" class="heading">Retrieval experiments</text>
  <rect x="550" y="188" width="160" height="30" rx="8" fill="#ede9fe"/>
  <rect x="550" y="228" width="160" height="30" rx="8" fill="#ede9fe"/>
  <text x="630" y="208" text-anchor="middle" class="body">BM25 / dense</text>
  <text x="630" y="248" text-anchor="middle" class="body">cross-encoder rerank</text>
  <text x="630" y="280" text-anchor="middle" class="body">Recall@K</text>

  <text x="872" y="198" text-anchor="middle" class="white">Prompt</text>
  <text x="872" y="224" text-anchor="middle" class="body" style="fill:#ede9fe">question + Top-10</text>
  <text x="872" y="247" text-anchor="middle" class="body" style="fill:#ede9fe">reranked passages</text>

  <text x="1082" y="198" text-anchor="middle" class="white">Mistral 7B</text>
  <text x="1082" y="224" text-anchor="middle" class="body" style="fill:#e2e8f0">4-bit inference</text>
  <text x="1082" y="247" text-anchor="middle" class="body" style="fill:#e2e8f0">short answer</text>

  <path d="M230 215 H276" class="arrow"/>
  <path d="M470 215 H516" class="arrow"/>
  <path d="M735 215 H781" class="arrow"/>
  <path d="M955 215 H1001" class="arrow"/>

  <rect x="285" y="365" width="670" height="105" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="620" y="401" text-anchor="middle" class="heading">Selected configuration</text>
  <text x="620" y="429" text-anchor="middle" class="body">BM25 + MS MARCO cross-encoder · Top-10 · zero-shot Mistral-7B-Instruct-v0.3</text>
  <text x="620" y="453" text-anchor="middle" class="body">Official TriviaQA evaluation: Exact Match + token-level F1</text>
  <path d="M1082 275 V325 H620 V355" class="arrow"/>
</svg>
